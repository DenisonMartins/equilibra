<div class="max-w-7xl mx-auto p-6 space-y-6">
  <header>
    <h1 class="text-2xl font-bold text-slate-100 tracking-tight">Gestão de Convites</h1>
    <p class="text-sm text-slate-400 mt-1">Envie convites por e-mail para novos usuários criarem suas contas.</p>
  </header>

  @if (mensagemSucesso()) {
    <div class="p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 rounded-lg text-sm flex items-center justify-between">
      <span>{{ mensagemSucesso() }}</span>
      <button (click)="mensagemSucesso.set(null)" class="text-emerald-400 hover:text-white">&times;</button>
    </div>
  }

  @if (mensagemErro()) {
    <div class="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-lg text-sm flex items-center justify-between">
      <span>{{ mensagemErro() }}</span>
      <button (click)="mensagemErro.set(null)" class="text-rose-400 hover:text-white">&times;</button>
    </div>
  }

  <!-- Formulário de Envio -->
  <app-convite-form (enviar)="onEnviarConvite($event)" />

  <!-- Filtros -->
  <app-convite-filtro (filtrar)="onAplicarFiltro($event)"/>

  <!-- Tabela com Listagem -->
  <app-convite-tabela
    [itens]="convites()"
    [carregando]="carregando()"
    [paginaAtual]="pagina()"
    [totalPaginas]="totalPaginas()"
    (atualizar)="carregarDados()"
    (trocarPagina)="onTrocarPagina($event)"
  />
</div>
