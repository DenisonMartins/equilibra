<div class="min-h-screen flex bg-slate-950 text-slate-100">
  <aside class="w-64 border-r border-slate-800 p-4 flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 px-2 mb-8">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950 font-bold">
          E
        </div>
        <span class="font-bold text-lg tracking-tight">Equilibra</span>
      </div>

      <nav class="space-y-1 text-sm font-medium">
        <a routerLink="/app/dashboard" routerLinkActive="bg-slate-900 text-emerald-400 border border-slate-800"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 transition">
          <span>📊</span> Visão Geral
        </a>

        <a routerLink="/app/lancamentos" routerLinkActive="bg-slate-900 text-emerald-400 border border-slate-800"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 transition">
          <span>💳</span> Lançamentos
        </a>

        <a routerLink="/app/consultor-ia" routerLinkActive="bg-slate-900 text-emerald-400 border border-slate-800"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 transition">
          <span>✨</span> Consultor IA
        </a>

        @if (authService.isAdmin()) {
          <div class="pt-4 pb-1 px-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">
            Administração
          </div>
          <a routerLink="/app/admin/usuarios" routerLinkActive="bg-slate-900 text-emerald-400 border border-slate-800"
             class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 transition">
            <span>👥</span> Convidar Usuários
          </a>
        }
      </nav>
    </div>

    <div class="border-t border-slate-800/80 pt-4 px-2 flex items-center justify-between">
      <div class="truncate">
        <p class="text-xs font-semibold text-slate-200 truncate">{{ authService.usuarioCorrente()?.nome }}</p>
        <p class="text-[10px] text-slate-500 truncate">{{ authService.usuarioCorrente()?.email }}</p>
      </div>
      <button (click)="authService.logout()" title="Sair" class="text-slate-400 hover:text-red-400 text-xs p-1 cursor-pointer">
        Sair
      </button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>
