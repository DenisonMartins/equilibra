<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

  <!-- Card Receitas -->
  <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur-sm shadow-sm flex items-center justify-between">
    <div>
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Receitas</span>
      <p class="text-2xl font-bold text-emerald-400 mt-1">
        {{ resumo().totalReceitas | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
      </p>
    </div>
    <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12" />
      </svg>
    </div>
  </div>

  <!-- Card Despesas -->
  <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur-sm shadow-sm flex items-center justify-between">
    <div>
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Despesas</span>
      <p class="text-2xl font-bold text-rose-400 mt-1">
        {{ resumo().totalDespesas | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
      </p>
    </div>
    <div class="w-10 h-10 rounded-lg bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6" />
      </svg>
    </div>
  </div>

  <!-- Card Saldo Geral -->
  <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur-sm shadow-sm flex items-center justify-between">
    <div>
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Saldo Líquido</span>
      <p class="text-2xl font-bold mt-1" [ngClass]="resumo().saldo >= 0 ? 'text-emerald-400' : 'text-rose-400'">
        {{ resumo().saldo | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
      </p>
    </div>
    <div class="w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center"
         [ngClass]="resumo().saldo >= 0 ? 'text-emerald-400' : 'text-rose-400'">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
  </div>

</div>
