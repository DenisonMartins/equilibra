<div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 mb-6 backdrop-blur-sm shadow-sm">
  <form [formGroup]="filtroForm" (ngSubmit)="submeter()" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

      <!-- Descrição -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Descrição</label>
        <input
          type="text"
          formControlName="descricao"
          placeholder="Buscar lançamento..."
          class="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
      </div>

      <!-- Tipo -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Tipo</label>
        <select
          formControlName="tipo"
          class="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-1 focus:ring-emerald-500">
          <option value="">Todos os tipos</option>
          <option value="RECEITA">Receita</option>
          <option value="DESPESA">Despesa</option>
        </select>
      </div>

      <!-- Período Data Início -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Data Inicial</label>
        <input
          type="date"
          formControlName="dataInicio"
          class="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
      </div>

      <!-- Período Data Fim -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Data Final</label>
        <input
          type="date"
          formControlName="dataFim"
          class="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
      </div>

    </div>

    <!-- Ações do Filtro -->
    <div class="flex justify-end gap-2 pt-1 border-t border-slate-800/60">
      <button
        type="button"
        (click)="limpar()"
        class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-colors">
        Limpar Filtros
      </button>
      <button
        type="submit"
        class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        Aplicar Filtros
      </button>
    </div>
  </form>
</div>
