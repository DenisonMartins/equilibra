<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center gap-3 justify-center mb-6">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-bold text-xl">
        E
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Equilibra</h1>
    </div>

    @if (!tokenValido()) {
      <div class="text-center py-4">
        <div class="w-12 h-12 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center mx-auto mb-3 text-xl">
          ✕
        </div>
        <h2 class="text-base font-semibold text-white mb-1">Convite Inválido ou Expirado</h2>
        <p class="text-xs text-slate-400 mb-6">O link utilizado não é mais válido. Solicite um novo acesso ao administrador.</p>
        <button
          type="button"
          (click)="irParaLogin()"
          class="inline-block py-2.5 px-5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition cursor-pointer">
          Ir para o Login
        </button>
      </div>
    } @else {
      <h2 class="text-lg font-semibold text-slate-200 mb-1 text-center">Ativar sua Conta</h2>
      <p class="text-xs text-slate-400 text-center mb-6">
        Cadastrando acesso para <span class="text-emerald-400 font-medium">{{ emailConvidado() }}</span>
      </p>

      <form (ngSubmit)="handleCadastro()" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">SEU NOME COMPLETO</label>
          <input
            type="text"
            [(ngModel)]="nome"
            name="nome"
            placeholder="Ex: Carlos Silva"
            required
            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-emerald-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">CRIE UMA SENHA</label>
          <input
            type="password"
            [(ngModel)]="senha"
            name="senha"
            placeholder="Mínimo 8 caracteres"
            required
            minlength="8"
            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-emerald-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">CONFIRME A SENHA</label>
          <input
            type="password"
            [(ngModel)]="confirmaSenha"
            name="confirmaSenha"
            placeholder="Repita a senha"
            required
            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-emerald-500 transition" />
        </div>

        @if (erroValidacao()) {
          <p class="text-xs text-red-400">{{ erroValidacao() }}</p>
        }

        <button
          type="submit"
          class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg text-sm transition shadow-lg shadow-emerald-500/10 cursor-pointer mt-2">
          Concluir Cadastro e Acessar
        </button>
      </form>
    }
  </div>
</div>
