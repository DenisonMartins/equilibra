<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center gap-3 justify-center mb-8">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-bold text-xl">
        E
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Equilibra</h1>
    </div>

    <h2 class="text-lg font-semibold text-slate-200 mb-1 text-center">Acesse sua conta</h2>
    <p class="text-xs text-slate-400 text-center mb-6">Controle financeiro pessoal e inteligente</p>

    <form (ngSubmit)="handleLogin()" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">E-MAIL</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          required
          class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-emerald-500 transition" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">SENHA</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-emerald-500 transition" />
      </div>

      <div class="flex items-center gap-2 pt-2">
        <input type="checkbox" id="adminCheck" [(ngModel)]="isAdminMock" name="adminCheck" class="rounded bg-slate-800 border-slate-700 text-emerald-500 focus:ring-0 cursor-pointer">
        <label for="adminCheck" class="text-xs text-slate-400 cursor-pointer select-none">Simular perfil de Administrador</label>
      </div>

      <button
        type="submit"
        class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg text-sm transition shadow-lg shadow-emerald-500/10 cursor-pointer mt-2">
        Entrar no Sistema
      </button>
    </form>
  </div>
</div>
